<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我要告奶奶</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Rounded MT Bold', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background-color: #ffccd5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            transition: background-color 0.5s;
        }
        
        .header {
            font-size: 3rem;
            color: #ff6699;
            text-shadow: 3px 3px 0 #ff99cc;
            margin: 20px 0;
            text-align: center;
        }
        
        .main-text {
            background-color: white;
            padding: 30px 50px;
            border-radius: 25px;
            border: 8px dashed #ff99cc;
            font-size: 2.5rem;
            color: #ff3366;
            margin: 30px 0;
            text-align: center;
            box-shadow: 0 10px 20px rgba(255, 102, 153, 0.3);
            transition: color 0.3s, transform 0.3s;
        }
        
        .buttons-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            width: 100%;
            max-width: 800px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            font-weight: bold;
        }
        
        .btn-color {
            background-color: #ffcc00;
            color: #663300;
        }
        
        .btn-text {
            background-color: #66cc66;
            color: white;
        }
        
        .btn-angry {
            background-color: #ff3333;
            color: white;
        }
        
        .btn-game {
            background-color: #3399ff;
            color: white;
        }
        
        .angry-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        
        .angry-message {
            background-color: white;
            padding: 30px 50px;
            border-radius: 20px;
            font-size: 2.5rem;
            color: #ff3333;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
            transform: scale(0.8);
            transition: transform 0.5s;
        }
        
        .emoji {
            position: fixed;
            font-size: 2rem;
            z-index: 999;
            pointer-events: none;
            animation: fall linear forwards;
        }
        
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }
        
        .game-container {
            background-color: white;
            border-radius: 20px;
            padding: 20px;
            margin-top: 20px;
            width: 95%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: none;
        }
        
        .game-header {
            text-align: center;
            margin-bottom: 20px;
            color: #3399ff;
            font-size: 1.8rem;
        }
        
        .game-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            background-color: #f0f8ff;
            padding: 15px;
            border-radius: 15px;
        }
        
        .stat {
            text-align: center;
            padding: 10px;
            background: white;
            border-radius: 10px;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #3399ff;
        }
        
        .progress-container {
            width: 100%;
            height: 20px;
            background-color: #e0e0e0;
            border-radius: 10px;
            margin: 10px 0;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #66cc66, #4CAF50);
            width: 0%;
            transition: width 0.5s;
        }
        
        .game-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: center;
        }
        
        .game-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .game-btn:hover {
            transform: scale(1.05);
        }
        
        .scenes-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .scene {
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            background-color: #e6f7ff;
            transition: all 0.2s;
            text-align: center;
        }
        
        .scene.active {
            background-color: #3399ff;
            color: white;
        }
        
        .upgrades-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .upgrade {
            padding: 10px;
            border-radius: 10px;
            background-color: #fff9e6;
            border: 2px solid #ffcc00;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .upgrade:hover {
            background-color: #fff0cc;
        }
        
        .inventory {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        
        .inventory-slots {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 10px;
        }
        
        .slot {
            width: 70px;
            height: 70px;
            border: 2px solid #66cc66;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
        }
        
        .item {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
            text-align: center;
            padding: 5px;
        }
        
        .item.exp-boost {
            background: linear-gradient(135deg, #ff9900, #ff6600);
        }
        
        .close-game {
            display: block;
            margin: 20px auto 0;
            padding: 10px 20px;
            background-color: #ff6666;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1001;
        }
    </style>
</head>
<body>
    <h1 class="header">我要告奶奶</h1>
    
    <div class="main-text">告奶奶</div>
    
    <div class="buttons-container">
        <button class="btn btn-color">修改颜色</button>
        <button class="btn btn-text">修改文字</button>
        <button class="btn btn-angry">告奶奶！</button>
        <button class="btn btn-game">挂机游戏</button>
    </div>
    
    <div class="angry-overlay">
        <div class="angry-message">不许告奶奶！</div>
    </div>
    
    <div class="game-container">
        <h2 class="game-header">告奶奶挂机游戏</h2>
        
        <div class="game-stats">
            <div class="stat">
                <div>等级</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat">
                <div>经验</div>
                <div class="stat-value" id="exp">0/100</div>
            </div>
            <div class="stat">
                <div>经验/秒</div>
                <div class="stat-value" id="exp-per-sec">1</div>
            </div>
            <div class="stat">
                <div>金币</div>
                <div class="stat-value" id="gold">100</div>
            </div>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="exp-bar"></div>
        </div>
        
        <div class="game-controls">
            <button class="game-btn" id="click-exp" style="background: #ffcc00;">点击获得经验 (+10)</button>
            <button class="game-btn" id="golden-click" style="background: gold;">黄金点击 (就绪)</button>
        </div>
        
        <div class="scenes-container">
            <div class="scene active">普通场景 (1x)</div>
            <div class="scene">学习场景 (2x)</div>
            <div class="scene">工作场景 (3x)</div>
        </div>
        
        <div class="upgrades-container">
            <div class="upgrade" id="upgrade-click">
                <div>点击力量升级</div>
                <div>花费: 50金币</div>
            </div>
            <div class="upgrade" id="upgrade-exp">
                <div>经验提升</div>
                <div>花费: 100金币</div>
            </div>
        </div>
        
        <div class="inventory">
            <h3>背包</h3>
            <div class="inventory-slots" id="inventory-slots">
                <div class="slot"></div>
                <div class="slot"></div>
                <div class="slot"></div>
            </div>
        </div>
        
        <button class="close-game">关闭游戏</button>
    </div>

    <script>
        // 初始弹窗
        setTimeout(() => alert("你好呀"), 500);
        setTimeout(() => alert("欢迎访问"), 1500);
        setTimeout(() => alert("还有……"), 2500);
        setTimeout(() => alert("告奶奶！！"), 3500);

        // 获取DOM元素
        const mainText = document.querySelector('.main-text');
        const btnColor = document.querySelector('.btn-color');
        const btnText = document.querySelector('.btn-text');
        const btnAngry = document.querySelector('.btn-angry');
        const btnGame = document.querySelector('.btn-game');
        const angryOverlay = document.querySelector('.angry-overlay');
        const gameContainer = document.querySelector('.game-container');
        const closeGameBtn = document.querySelector('.close-game');

        // 修改颜色功能
        btnColor.addEventListener('click', () => {
            const color = prompt("请输入颜色名称:");
            if (color) {
                const colorMap = {
                    '红色': 'red', '蓝色': 'blue', '绿色': 'green',
                    '黄色': 'yellow', '紫色': 'purple', '粉色': 'pink'
                };
                mainText.style.color = colorMap[color] || color;
            }
        });

        // 修改文字功能
        btnText.addEventListener('click', () => {
            const text = prompt("请输入新的文字:");
            if (text) mainText.textContent = text;
        });

        // 愤怒效果功能
        btnAngry.addEventListener('click', () => {
            document.body.style.backgroundColor = '#333';
            angryOverlay.style.opacity = '1';
            angryOverlay.style.pointerEvents = 'auto';

            // 创建愤怒emoji
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const emoji = document.createElement('div');
                    emoji.className = 'emoji';
                    emoji.textContent = '😠';
                    emoji.style.left = Math.random() * 100 + 'vw';
                    emoji.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    document.body.appendChild(emoji);
                    setTimeout(() => emoji.remove(), 5000);
                }, i * 100);
            }

            setTimeout(() => {
                angryOverlay.style.opacity = '0';
                document.body.style.backgroundColor = '#ffccd5';
            }, 4000);
        });

        // 游戏功能
        btnGame.addEventListener('click', () => {
            gameContainer.style.display = 'block';
        });
        closeGameBtn.addEventListener('click', () => {
            gameContainer.style.display = 'none';
        });

        // 游戏状态
        const gameState = {
            level: 1,
            exp: 0,
            maxExp: 100,
            expPerSec: 1,
            gold: 100,
            clickPower: 10,
            goldenClickReady: true
        };

        // 更新游戏显示
        function updateGame() {
            document.getElementById('level').textContent = gameState.level;
            document.getElementById('exp').textContent = `${gameState.exp}/${gameState.maxExp}`;
            document.getElementById('exp-per-sec').textContent = gameState.expPerSec;
            document.getElementById('gold').textContent = gameState.gold;
            
            const expPercent = (gameState.exp / gameState.maxExp) * 100;
            document.getElementById('exp-bar').style.width = expPercent + '%';
        }

        // 增加经验
        function addExp(amount) {
            gameState.exp += amount;
            while (gameState.exp >= gameState.maxExp) {
                gameState.exp -= gameState.maxExp;
                gameState.level++;
                gameState.maxExp = Math.floor(gameState.maxExp * 1.5);
                gameState.gold += gameState.level * 20;
                alert(`升级！当前等级：${gameState.level}`);
            }
            updateGame();
        }

        // 点击获得经验
        document.getElementById('click-exp').addEventListener('click', () => {
            addExp(gameState.clickPower);
        });

        // 黄金点击
        document.getElementById('golden-click').addEventListener('click', function() {
            if (gameState.goldenClickReady) {
                addExp(gameState.clickPower * 5);
                gameState.goldenClickReady = false;
                this.textContent = '黄金点击 (冷却)';
                this.disabled = true;
                
                setTimeout(() => {
                    gameState.goldenClickReady = true;
                    this.textContent = '黄金点击 (就绪)';
                    this.disabled = false;
                }, 10000);
            }
        });

        // 升级系统
        document.getElementById('upgrade-click').addEventListener('click', () => {
            if (gameState.gold >= 50) {
                gameState.gold -= 50;
                gameState.clickPower += 5;
                updateGame();
                alert('点击力量升级！');
            } else {
                alert('金币不足！');
            }
        });

        document.getElementById('upgrade-exp').addEventListener('click', () => {
            if (gameState.gold >= 100) {
                gameState.gold -= 100;
                gameState.expPerSec += 1;
                updateGame();
                alert('经验获取速度提升！');
            } else {
                alert('金币不足！');
            }
        });

        // 场景切换
        document.querySelectorAll('.scene').forEach((scene, index) => {
            scene.addEventListener('click', () => {
                document.querySelectorAll('.scene').forEach(s => s.classList.remove('active'));
                scene.classList.add('active');
                gameState.expPerSec = 1 + index;
                updateGame();
            });
        });

        // 自动获取经验
        setInterval(() => {
            addExp(gameState.expPerSec);
        }, 1000);

        // 初始化游戏
        updateGame();
    </script>
</body>
</html>
