<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(*╹▽╹*)我是小阚</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            background-color: #000;

            font-family: 'Arial', 'Microsoft YaHei', sans-serif;

            align-items: center;

            overflow: hidden;

            white-space: nowrap;

                letter-spacing: 3px;
            }
        }
        
        @media (max-width: 480px) {
            .main-text {
                font-size: 1.5rem;

<body>
    <div class="main-content">
